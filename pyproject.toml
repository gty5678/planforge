[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "construction-schedule-manager"
version = "0.1.0"
description = "基于 PySide6 和 SQLite 的单机工程计划横道图软件"
requires-python = ">=3.13,<3.14"
dependencies = ["PySide6>=6.7,<7"]

[project.gui-scripts]
construction-schedule = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["construction_manager*"]

[tool.setuptools.package-data]
construction_manager = ["assets/*.png", "assets/*.ico"]
